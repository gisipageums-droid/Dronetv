server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (filename changes whenever content changes) - safe
    # to cache forever, browsers naturally re-fetch on the next deploy since
    # index.html below will reference a new filename.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static gallery/site photos (/images/*.jpg etc.) - filenames are fixed,
    # not content-hashed like /assets/, but they're also not expected to
    # change from one minute to the next like index.html. Falling through to
    # the catch-all `location /` below (no-store) meant every single image on
    # every page view was a full fresh download, never a cache hit or even a
    # fast conditional 304. public + a real max-age still lets a genuinely
    # updated photo through within a day.
    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # index.html itself is NOT content-hashed - it must always be revalidated,
    # otherwise a browser can keep serving a stale HTML shell that references
    # asset filenames from a previous deploy which no longer exist, silently
    # breaking CSS/JS with no visible error (this is exactly what happened:
    # cached index.html referenced an index-*.css hash from an older build,
    # 404s on that filename fell through to this SPA's own try_files fallback
    # -> served index.html itself with a 200 and text/html content-type in
    # place of the CSS, so styles depending on it silently never applied).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
