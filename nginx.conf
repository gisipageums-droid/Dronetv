server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rich link-preview URLs for the company Share button (WhatsApp/Instagram
    # etc.) - a crawler-detecting endpoint on the company service, not a
    # static file. dev-branch only: proxies to the dev backend directly,
    # this file never reaches prod (prod builds from a different branch).
    location /s/ {
        rewrite ^/s/(.*)$ /api/v1/company/share/$1 break;
        proxy_pass https://company-api-dev.dronetv.in;
        proxy_set_header Host company-api-dev.dronetv.in;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Hashed build assets (filename changes whenever content changes) - safe
    # to cache forever, browsers naturally re-fetch on the next deploy since
    # index.html below will reference a new filename.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html itself is NOT content-hashed - it must always be revalidated,
    # otherwise a browser can keep serving a stale HTML shell that references
    # asset filenames from a previous deploy which no longer exist, silently
    # breaking CSS/JS with no visible error (this is exactly what happened:
    # cached index.html referenced an index-*.css hash from an older build,
    # 404s on that filename fell through to this SPA's own try_files fallback
    # -> served index.html itself with a 200 and text/html content-type in
    # place of the CSS, so styles depending on it silently never applied).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
