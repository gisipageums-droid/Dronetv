<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#FFC400">
    <meta name="description" content="DroneTV is a specialized digital ecosystem connecting the Drone, GIS and AI industries through companies, professionals, products, services, jobs, events and business opportunities.">
    <title>DroneTV | Voice of Drone Technology, GIS, AI Technologies</title>

    <!-- Font Awesome for social-media icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          crossorigin="anonymous"
          referrerpolicy="no-referrer">

    <style>
:root {
    --yellow:#FFC400;
    --yellow-dark:#D99F00;
    --cream:#FFF9DF;
    --black:#111111;
    --white:#FFFFFF;
    --text:#252525;
    --muted:#666666;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    color:var(--text);
    /* The highlight's radius was unset, so its default sizing (distance to
       the farthest corner) scaled with the screen's diagonal - on a tall
       narrow phone that diagonal is much longer than on a wide desktop, so
       the same "26%" stop covered a far bigger share of the screen and
       washed the gold out to pale cream on mobile. A fixed pixel radius
       keeps the glow the same physical size everywhere. */
    background:
      radial-gradient(circle 380px at 12% 8%, rgba(255,255,255,.85), transparent 100%),
      linear-gradient(135deg,#FFD83D 0%,#FFC400 48%,#F4B900 100%);
    min-height:100vh;
}
a{text-decoration:none;color:inherit}
.linktree-page{min-height:100vh}
.linktree-wrap{
    min-height:100vh;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:38px 16px 55px;
}
.profile-card{
    width:min(100%,620px);
    text-align:center;
    padding:32px 22px 28px;
    background:transparent;
}
.list-company-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:min(100%,390px);
    margin:0 auto 20px;
    padding:15px 22px;
    background:var(--yellow);
    color:#111;
    font-weight:900;
    font-size:16px;
    border-radius:999px;
    box-shadow:0 10px 28px rgba(0,0,0,.14);
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.list-company-btn:hover{
    background:var(--yellow-dark);
    transform:translateY(-2px);
    box-shadow:0 14px 32px rgba(0,0,0,.18);
}
.brand-logo-wrap{
    width:min(100%,390px);
    aspect-ratio:2.05/1;
    margin:0 auto 18px;
    background:var(--yellow);
    border-radius:20px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 12px 35px rgba(0,0,0,.10);
}
.profile-logo{
    width:100%;
    height:100%;
    object-fit:cover;
}
.profile-card h1{
    color:#111;
    font-size:31px;
    font-weight:900;
    letter-spacing:-.8px;
}
.profile-tagline{
    color:#111;
    font-size:14px;
    font-weight:800;
    margin-top:3px;
}
.profile-description{
    color:#666;
    max-width:500px;
    margin:9px auto 17px;
    font-size:14px;
    line-height:1.5;
}
.social-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:0 auto 22px;
}
.social-icon{
    width:45px;
    height:45px;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--social-color);
    background:#fff;
    border:1px solid #E8E8E8;
    box-shadow:0 5px 14px rgba(0,0,0,.08);
    font-size:18px;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.social-icon:hover{
    transform:translateY(-4px) scale(1.04);
    box-shadow:0 10px 22px rgba(0,0,0,.13);
    background:#fafafa;
}
.link-list{
    display:grid;
    gap:13px;
}
.link-button{
    min-height:66px;
    padding:10px 16px 10px 12px;
    background:#fff;
    border:2px solid #EFEFEF;
    border-radius:17px;
    display:grid;
    grid-template-columns:46px 1fr 28px;
    align-items:center;
    gap:12px;
    text-align:left;
    font-size:15px;
    font-weight:800;
    color:#161616;
    box-shadow:0 6px 16px rgba(0,0,0,.055);
    transition:.2s ease;
}
.link-button:hover{
    transform:translateY(-2px);
    border-color:var(--yellow);
    box-shadow:0 10px 24px rgba(0,0,0,.10);
}
.link-button-icon{
    width:46px;
    height:46px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:var(--yellow);
    color:#111;
    font-size:19px;
}
.link-button:first-child .link-button-icon,
.link-button-icon.website{
    background:#111;
    color:var(--yellow);
}
.link-arrow{
    color:#999;
    font-size:13px;
    text-align:right;
}
.mini-badges{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin:22px 0 16px;
}
.mini-badges span{
    border-radius:999px;
    background:#FFF5C7;
    color:#765500;
    padding:7px 11px;
    font-size:10px;
    font-weight:900;
    letter-spacing:.05em;
}
.mini-badges i{margin-right:4px}
.share-row button{
    border:0;
    cursor:pointer;
    background:#111;
    color:#fff;
    padding:11px 17px;
    border-radius:999px;
    font-weight:800;
    font-size:12px;
    transition:.2s;
}
.share-row button:hover{background:#292929;transform:translateY(-1px)}
.copyright{
    color:#999;
    font-size:11px;
    margin-top:18px;
}
.hidden-content-section{
    padding:90px 0;
    background:#fffdf3;
}
.dark-section{
    background:#111;
    color:#fff;
}
.contact-section{padding-bottom:120px}
.container{width:min(1100px,92%);margin:auto}
.section-head{text-align:center;max-width:750px;margin:0 auto}
.section-head .label{
    color:#A06E00;
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.12em;
}
.section-head h2{
    font-size:clamp(30px,5vw,52px);
    line-height:1.05;
    color:#111;
    margin:10px 0;
}
.section-head p{color:#666}
.dark-section .section-head h2{color:#fff}
.dark-section .section-head p{color:#bbb}
@media(max-width:500px){
    .linktree-wrap{padding:15px 10px 30px}
    .profile-card{border-radius:24px;padding:24px 14px 23px}
    .list-company-btn{padding:13px 18px;font-size:14px}
    .brand-logo-wrap{border-radius:16px}
    .profile-card h1{font-size:27px}
    .profile-description{font-size:13px}
    .social-icon{width:42px;height:42px;font-size:17px}
    .link-button{min-height:61px;grid-template-columns:42px 1fr 24px;font-size:14px;padding-right:12px}
    .link-button-icon{width:42px;height:42px}
}

        /* =========================================================
           MOBILE-FIRST OPTIMIZATION
           ========================================================= */

        html {
            width: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-width: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        img {
            max-width: 100%;
        }

        .page {
            width: 100%;
            min-height: 100svh;
            padding:
                max(12px, env(safe-area-inset-top))
                max(8px, env(safe-area-inset-right))
                max(22px, env(safe-area-inset-bottom))
                max(8px, env(safe-area-inset-left));
        }

        .profile-card {
            width: min(100%, 650px);
            max-width: 650px;
            margin: 0 auto;
            padding:
                clamp(16px, 4vw, 30px)
                clamp(10px, 4vw, 25px)
                clamp(20px, 5vw, 28px);
            border-radius: clamp(20px, 5vw, 30px);
        }

        .logo-container {
            width: min(100%, 430px);
            min-width: 0;
            aspect-ratio: 1.9 / 1;
            margin-bottom: clamp(14px, 3vw, 20px);
            border-radius: clamp(14px, 3vw, 20px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 100%;
            height: 100%;
            max-height: none;
            object-fit: contain;
            padding: 5px;
        }

        .brand-name {
            font-size: clamp(26px, 8vw, 38px);
            line-height: 1.05;
            overflow-wrap: anywhere;
        }

        .tagline {
            font-size: clamp(11px, 3.2vw, 15px);
            line-height: 1.4;
        }

        .description {
            width: 100%;
            max-width: 530px;
            margin:
                clamp(10px, 2.5vw, 12px)
                auto
                clamp(15px, 4vw, 20px);
            font-size: clamp(12px, 3.5vw, 14px);
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        .technology-row {
            width: 100%;
            gap: 7px;
            margin-bottom: 18px;
        }

        .technology {
            max-width: 100%;
            padding: 7px 10px;
            font-size: clamp(8px, 2.4vw, 10px);
            line-height: 1.2;
            white-space: normal;
            text-align: center;
        }

        .technology.robotics {
            padding-left: 10px;
            padding-right: 10px;
        }

        .social-title {
            font-size: 10px;
            margin-bottom: 10px;
        }

        .social-row {
            gap: 8px;
            margin-bottom: 20px;
        }

        .social-icon {
            width: clamp(40px, 11vw, 46px);
            height: clamp(40px, 11vw, 46px);
            flex: 0 0 auto;
            font-size: clamp(15px, 4.3vw, 18px);
        }

        .links {
            width: 100%;
            gap: 10px;
        }

        .link-button {
            min-height: clamp(58px, 16vw, 66px);
            grid-template-columns:
                clamp(40px, 12vw, 48px)
                minmax(0, 1fr)
                20px;
            gap: 9px;
            padding:
                7px
                10px
                7px
                7px;
            border-radius: 15px;
            font-size: clamp(12px, 3.6vw, 14px);
            line-height: 1.3;
        }

        .link-icon {
            width: clamp(40px, 12vw, 48px);
            height: clamp(40px, 12vw, 48px);
            border-radius: 12px;
            font-size: clamp(16px, 4.5vw, 19px);
        }

        .link-button > span:nth-child(2) {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .link-arrow {
            font-size: 11px;
        }

        .share-container {
            margin-top: 17px;
        }

        .share-button {
            min-height: 44px;
            padding: 11px 17px;
            font-size: 12px;
            touch-action: manipulation;
        }

        .footer {
            margin-top: 16px;
            font-size: 10px;
        }

        /* Touch devices: eliminate hover-only visual movement. */
        @media (hover: none) {
            .social-icon:hover,
            .link-button:hover,
            .share-button:hover {
                transform: none;
            }
        }

        /* Very small phones */
        @media (max-width: 380px) {
            .profile-card {
                padding-left: 10px;
                padding-right: 10px;
            }

            .technology-row {
                gap: 5px;
            }

            .technology {
                padding: 6px 8px;
                font-size: 8px;
            }

            .technology.robotics {
                width: 100%;
            }

            .social-row {
                gap: 6px;
            }

            .link-button {
                grid-template-columns: 40px minmax(0, 1fr) 18px;
                font-size: 12px;
            }

            .link-icon {
                width: 40px;
                height: 40px;
            }
        }

        /* Tablet / desktop breathing room */
        @media (min-width: 768px) {
            .page {
                padding-top: 35px;
                padding-bottom: 50px;
            }

            .profile-card {
                padding: 30px 25px 28px;
            }
        }

        /* Landscape phones */
        @media (max-height: 520px) and (orientation: landscape) {
            .page {
                align-items: flex-start;
                padding-top: 10px;
            }

            .profile-card {
                max-width: 700px;
            }

            .logo-container {
                max-width: 320px;
            }
        }

    </style>
</head>
